# Public template. Replace every <PLACEHOLDER> with your own Cloudflare resource IDs
# (wrangler kv namespace create / wrangler d1 create). Rate-limit namespace IDs must be
# unique integers within your account. Secrets go in `wrangler secret put`, never here.

account_id = "<CLOUDFLARE_ACCOUNT_ID>"
name = "certguard-staging"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

[limits]
cpu_ms = 100

[vars]
ENVIRONMENT = "staging"
PUBLIC_LAUNCH = "false"
ANON_PER_MIN = "10"
ANON_DAILY_PER_IP = "200"
KEY_PER_MIN = "60"
KEY_DAILY_QUOTA = "1000"
CACHE_TTL_SECONDS = "600"
CT_CACHE_TTL_SECONDS = "3600"
CT_HOURLY_BUDGET = "80"
KEY_ISSUE_PER_IP_PER_DAY = "3"
ANON_DAILY_PER_IP48 = "600"
KEY_ISSUER_DAILY_QUOTA = "300"
NEG_CACHE_TTL_SECONDS = "600"
BLOCKED_CACHE_TTL_SECONDS = "300"
GLOBAL_DAILY_REQUEST_CAP = "3000"
GLOBAL_DAILY_LIVE_CAP = "1000"
KEY_ISSUE_GLOBAL_PER_DAY = "50"
PRO_DAILY_QUOTA = "10000"
PRO_GLOBAL_DAILY_CAP = "5000"
RAPIDAPI_GLOBAL_DAILY_CAP = "2000"
MCP_REGISTRY_AUTH = ""

[[kv_namespaces]]
binding = "CERTGUARD_KV"
id = "<KV_NAMESPACE_ID>"

[[kv_namespaces]]
binding = "LICENSES"
id = "<KV_NAMESPACE_ID>"
preview_id = "<KV_PREVIEW_NAMESPACE_ID>"

[[unsafe.bindings]]
name = "IP_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_1>"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "KEY_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_2>"
simple = { limit = 60, period = 60 }

[[unsafe.bindings]]
name = "RAPIDAPI_BASIC_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_3>"
simple = { limit = 10, period = 60 }

[[unsafe.bindings]]
name = "RAPIDAPI_PRO_LIMITER"
type = "ratelimit"
namespace_id = "<RATE_LIMIT_NAMESPACE_ID_4>"
simple = { limit = 120, period = 60 }

